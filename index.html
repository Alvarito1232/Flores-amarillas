<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flores Amarillas - 21 de Septiembre</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }

        /* Pantalla de inicio (Fondo negro con botón) */
        #pantalla-inicio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #boton-inicio {
            padding: 15px 35px;
            font-size: 20px;
            background-color: #FFD700;
            color: #000;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            transition: transform 0.2s ease;
        }

        #boton-inicio:active {
            transform: scale(0.95);
        }

        /* Pantalla principal (El bosque) */
        #paisaje {
            display: none; /* Oculto hasta presionar el botón */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?q=80&w=1964&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }

        /* Efecto de gravedad cero (Flores flotando suavemente) */
        .flor-flotando {
            position: absolute;
            width: 35px;
            height: 35px;
            background-image: url('https://cdn-icons-png.flaticon.com/512/183/183801.png'); /* Icono de flor/hoja amarilla */
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.85;
            animation: flotarCeroGravedad linear infinite;
        }

        @keyframes flotarCeroGravedad {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(30px, -40px) rotate(90deg);
            }
            50% {
                transform: translate(-20px, -80px) rotate(180deg);
            }
            75% {
                transform: translate(40px, -120px) rotate(270deg);
            }
            100% {
                transform: translate(-10px, -180px) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- Pantalla inicial -->
    <div id="pantalla-inicio">
        <button id="boton-inicio">Presiona</button>
    </div>

    <!-- Pantalla del bosque -->
    <div id="paisaje"></div>

    <script>
        const botonInicio = document.getElementById('boton-inicio');
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const paisaje = document.getElementById('paisaje');

        botonInicio.addEventListener('click', function() {
            // Ocultar inicio y mostrar el fondo del bosque
            pantallaInicio.style.display = 'none';
            paisaje.style.display = 'block';

            // Generar las flores flotando en gravedad cero
            crearEfectoGravedadCero();
        });

        function crearEfectoGravedadCero() {
            const cantidadFlores = 20; // Número de flores flotando a la vez
            for (let i = 0; i < cantidadFlores; i++) {
                const flor = document.createElement('div');
                flor.classList.add('flor-flotando');

                // Posición inicial aleatoria en la pantalla (empiezan desde abajo hacia arriba)
                flor.style.left = Math.random() * 100 + 'vw';
                flor.style.top = (Math.random() * 50 + 50) + 'vh'; 

                // Velocidad y retraso aleatorios para que se vea natural
                const duracion = Math.random() * 6 + 4; // Entre 4 y 10 segundos
                flor.style.animationDuration = duracion + 's';
                flor.style.animationDelay = (Math.random() * 5) + 's';

                paisaje.appendChild(flor);
            }
        }
    </script>

</body>
</html>
