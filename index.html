<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flores Amarillas - 21 de Septiembre</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }

        /* Pantalla de inicio */
        #pantalla-inicio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* Botón mejorado, brillante y llamativo */
        #boton-inicio {
            padding: 18px 40px;
            font-size: 22px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            transition: all 0.3s ease;
            position: relative;
        }

        #boton-inicio:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.9);
        }

        #texto-intentos {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* Pantalla principal con lluvia de flores diminutas */
        #espacio-lluvia {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }

        /* Estilo para las flores diminutas cayendo */
        .flor-diminuta {
            position: absolute;
            width: 15px; /* Tamaño diminuto */
            height: 15px;
            background-image: url('https://cdn-icons-png.flaticon.com/512/183/183801.png');
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.8;
            animation: caidaLibre linear infinite;
        }

        @keyframes caidaLibre {
            0% {
                transform: translateY(-20px) rotate(0deg);
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- Pantalla inicial -->
    <div id="pantalla-inicio">
        <button id="boton-inicio">Presiona aquí ✨</button>
        <div id="texto-intentos">Toca para descubrir algo especial</div>
    </div>

    <!-- Pantalla con fondo negro y lluvia de flores diminutas -->
    <div id="espacio-lluvia"></div>

    <script>
        const botonInicio = document.getElementById('boton-inicio');
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const espacioLluvia = document.getElementById('espacio-lluvia');
        const textoIntentos = document.getElementById('texto-intentos');

        let intentos = 0; // Contador para los clics falsos

        botonInicio.addEventListener('click', function() {
            intentos++;

            if (intentos === 1) {
                // Primer intento: el botón "falla" y se mueve a otro lado
                botonInicio.style.transform = 'translate(100px, -80px)';
                textoIntentos.innerText = "¡Uy, casi! Intenta de nuevo 😜";
            } 
            else if (intentos === 2) {
                // Segundo intento: se mueve hacia el otro lado y sigue sin abrir
                botonInicio.style.transform = 'translate(-120px, 90px)';
                textoIntentos.innerText = "¡Otra vez fallaste! Jaja 😂";
            } 
            else if (intentos >= 3) {
                // Tercer intento: ¡Ahora sí funciona y entra!
                pantallaInicio.style.display = 'none';
                espacioLluvia.style.display = 'block';
                iniciarLluviaDeFlores();
            }
        });

        function iniciarLluviaDeFlores() {
            const cantidad = 50; // ¡Bastantes flores diminutas cayendo!
            for (let i = 0; i < cantidad; i++) {
                const flor = document.createElement('div');
                flor.classList.add('flor-diminuta');

                // Posición horizontal aleatoria
                flor.style.left = Math.random() * 100 + 'vw';
                
                // Retraso y velocidad de caída variados para que se vea natural
                flor.style.animationDuration = (Math.random() * 3 + 2) + 's'; // Entre 2 y 5 segundos (rápido y fluido)
                flor.style.animationDelay = (Math.random() * 5) + 's';

                espacioLluvia.appendChild(flor);
            }
        }
    </script>

</body>
</html>
