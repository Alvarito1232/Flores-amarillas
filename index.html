<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flores Amarillas - 21 de Septiembre</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }

        /* Pantalla de inicio */
        #pantalla-inicio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* Grupo interactivo (botón + texto que se mueven juntos) */
        #grupo-interactivo {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }

        #boton-inicio {
            padding: 18px 40px;
            font-size: 22px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            transition: all 0.3s ease;
        }

        #boton-inicio:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.9);
        }

        #texto-intentos {
            margin-top: 20px;
            color: #aaa;
            font-size: 15px;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Pantalla de lluvia de corazones */
        #espacio-lluvia {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }

        /* Estilo de corazones con colores bien combinados */
        .corazon {
            position: absolute;
            width: 18px;
            height: 18px;
            transform: rotate(45deg);
            animation: caidaLluvia linear infinite;
        }

        .corazon::before,
        .corazon::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: inherit;
        }

        .corazon::before {
            top: -9px;
            left: 0;
        }

        .corazon::after {
            top: 0;
            left: -9px;
        }

        @keyframes caidaLluvia {
            0% {
                transform: translateY(-40px) rotate(45deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(405deg);
                opacity: 0.9;
            }
        }
    </style>
</head>
<body>

    <!-- Pantalla inicial con los 3 intentos -->
    <div id="pantalla-inicio">
        <div id="grupo-interactivo">
            <button id="boton-inicio">Presiona aquí ✨</button>
            <div id="texto-intentos">Toca para descubrir algo especial</div>
        </div>
    </div>

    <!-- Pantalla con fondo negro y lluvia de corazones -->
    <div id="espacio-lluvia"></div>

    <script>
        const grupoInteractivo = document.getElementById('grupo-interactivo');
        const botonInicio = document.getElementById('boton-inicio');
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const espacioLluvia = document.getElementById('espacio-lluvia');
        const textoIntentos = document.getElementById('texto-intentos');

        let intentos = 0;

        botonInicio.addEventListener('click', function() {
            intentos++;

            if (intentos === 1) {
                grupoInteractivo.style.transform = 'translate(110px, -70px)';
                textoIntentos.innerText = "¡Uy, casi! Intenta de nuevo 😜";
            } 
            else if (intentos === 2) {
                grupoInteractivo.style.transform = 'translate(-110px, 80px)';
                textoIntentos.innerText = "¡Otra vez fallaste! Jaja 😂";
            } 
            else if (intentos >= 3) {
                pantallaInicio.style.display = 'none';
                espacioLluvia.style.display = 'block';
                iniciarLluviaDeCorazones();
            }
        });

        function iniciarLluviaDeCorazones() {
            // Tonos románticos y elegantes que combinan perfectamente (Rojos, rosas, fucsias, dorados y blanco suave)
            const colores = ['#FF1744', '#FF4081', '#E91E63', '#FF5252', '#FF80AB', '#FFD700', '#FFA000', '#FFFFFF'];
            const cantidad = 70; 

            for (let i = 0; i < cantidad; i++) {
                const corazon = document.createElement('div');
                corazon.classList.add('corazon');

                // Color aleatorio de la paleta armónica
                corazon.style.backgroundColor = colores[Math.floor(Math.random() * colores.length)];

                // Posición horizontal aleatoria
                corazon.style.left = Math.random() * 100 + 'vw';
                
                // Sin retrasos largos para que comiencen de inmediato
                corazon.style.top = (Math.random() * -100 - 20) + 'px';

                // Caída mucho más rápida y fluida
                const duracion = Math.random() * 1.5 + 1.2; // Entre 1.2 y 2.7 segundos (más rápido)
                corazon.style.animationDuration = duracion + 's';
                corazon.style.animationDelay = (Math.random() * 1.5) + 's';

                espacioLluvia.appendChild(corazon);
            }
        }
    </script>

</body>
</html>
