<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorpresa Romántica Definitiva</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }

        #pantalla-inicio {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: radial-gradient(circle at center, #1a001a 0%, #000000 100%);
            overflow: hidden;
            padding: 15px;
        }

        .estrella-espacio {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: parpadeoStar 2s infinite ease-in-out alternate;
        }

        @keyframes parpadeoStar {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .estrella-fugaz {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,1), rgba(255,255,255,0));
            transform: rotate(-45deg);
            animation: disparoFugaz 3s linear infinite;
            opacity: 0;
        }

        @keyframes disparoFugaz {
            0% { transform: translateX(0) translateY(0) rotate(-45deg); opacity: 1; width: 80px; }
            100% { transform: translateX(-400px) translateY(400px) rotate(-45deg); opacity: 0; width: 10px; }
        }

        #grupo-interactivo {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
            z-index: 5;
            width: 100%;
            max-width: 300px;
            text-align: center;
        }

        #boton-inicio {
            width: 100%;
            max-width: 260px;
            padding: 15px 20px;
            font-size: 19px;
            background: linear-gradient(135deg, #FF1744, #D50000);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(255, 23, 68, 0.8);
            transition: all 0.3s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        #boton-inicio:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 23, 68, 1);
        }

        #texto-intentos {
            margin-top: 18px;
            color: #ff80ab;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 64, 129, 0.5);
            padding: 0 10px;
        }

        #espacio-animacion {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #000000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="pantalla-inicio">
        <div id="grupo-estrellas"></div>
        <div id="grupo-interactivo">
            <button id="boton-inicio">Presiona aquí ✨</button>
            <div id="texto-intentos">Toca para descubrir algo especial</div>
        </div>
    </div>

    <div id="espacio-animacion">
        <canvas id="canvasSorpresa"></canvas>
    </div>

    <script>
        const contenedorEstrellas = document.getElementById('grupo-estrellas');
        const esCelular = window.innerWidth < 768;
        const numEstrellas = esCelular ? 40 : 70;

        for (let i = 0; i < numEstrellas; i++) {
            let star = document.createElement('div');
            star.className = 'estrella-espacio';
            let size = Math.random() * 2.5 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.animationDelay = (Math.random() * 2) + 's';
            contenedorEstrellas.appendChild(star);
        }

        for (let j = 0; j < 2; j++) {
            let fugaz = document.createElement('div');
            fugaz.className = 'estrella-fugaz';
            fugaz.style.top = (Math.random() * 40) + 'vh';
            fugaz.style.left = (Math.random() * 40 + 60) + 'vw';
            fugaz.style.animationDelay = (j * 3 + Math.random()) + 's';
            contenedorEstrellas.appendChild(fugaz);
        }

        const grupoInteractivo = document.getElementById('grupo-interactivo');
        const botonInicio = document.getElementById('boton-inicio');
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const espacioAnimacion = document.getElementById('espacio-animacion');
        const textoIntentos = document.getElementById('texto-intentos');

        let intentos = 0;

        botonInicio.addEventListener('click', function() {
            intentos++;
            if (intentos === 1) {
                grupoInteractivo.style.transform = 'translate(60px, -50px)';
                textoIntentos.innerText = "¡Uy, casi! Intenta de nuevo 😜";
            } else if (intentos === 2) {
                grupoInteractivo.style.transform = 'translate(-60px, 60px)';
                textoIntentos.innerText = "¡Otra vez fallaste! Jaja 😂";
            } else if (intentos >= 3) {
                pantallaInicio.style.display = 'none';
                espacioAnimacion.style.display = 'block';
                iniciarSorpresaTotal();
            }
        });

        function iniciarSorpresaTotal() {
            const canvas = document.getElementById('canvasSorpresa');
            const ctx = canvas.getContext('2d');

            function ajustarCanvas() {
                const dpr = window.devicePixelRatio || 1;
                canvas.width = window.innerWidth * dpr;
                canvas.height = window.innerHeight * dpr;
                ctx.scale(dpr, dpr);
            }
            ajustarCanvas();
            window.addEventListener('resize', ajustarCanvas);

            const estrellasFondo = [];
            for (let i = 0; i < (esCelular ? 45 : 85); i++) {
                estrellasFondo.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    tamano: Math.random() * 1.5 + 0.5,
                    alfa: Math.random() * 0.7 + 0.2
                });
            }

            const secuencia = [
                "Te amo",
                "Mi niña",
                "Preciosa",
                ["Gracias", "por", "existir"],
                "CORAZON"
            ];

            let indicePaso = 0;
            let particulas = [];
            let contadorFrames = 0;
            const duracionPaso = 230;

            class Lluvia {
                constructor() { this.reiniciar(); }
                reiniciar() {
                    this.x = Math.random() * window.innerWidth;
                    this.y = -30 - Math.random() * 150;
                    this.vy = Math.random() * 3.5 + 2.5;
                    this.vx = (Math.random() - 0.5) * 1.5;
                    this.tamano = Math.random() * 6 + 4;
                    const col = ['#FF0000', '#FF1744', '#FF4081', '#FFD700', '#FFFFFF', '#00E676'];
                    this.color = col[Math.floor(Math.random() * col.length)];
                    this.rot = Math.random() * Math.PI;
                    this.vRot = (Math.random() - 0.5) * 0.1;
                }
                actualizar(activo) {
                    this.y += this.vy;
                    this.x += this.vx;
                    this.rot += this.vRot;
                    let cx = window.innerWidth / 2;
                    let cy = window.innerHeight / 2;
                    let col = false;
                    if (activo) {
                        if (Math.hypot(this.x - cx, this.y - cy) < (esCelular ? 130 : 180)) col = true;
                    } else {
                        if (this.y > cy - 100 && this.y < cy + 100 && this.x > cx - 180 && this.x < cx + 180) col = true;
                    }
                    if (col) {
                        this.vx = this.x < cx ? -4 : 4;
                        this.x += this.vx * 2;
                        this.y -= 2;
                    }
                    if (this.y > window.innerHeight + 30 || this.x < -50 || this.x > window.innerWidth + 50) {
                        this.reiniciar();
                    }
                }
                dibujar() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rot);
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = this.color;
                    ctx.beginPath();
                    let t = this.tamano;
                    ctx.moveTo(0, t / 4);
                    ctx.bezierCurveTo(-t, -t / 2, -t, t, 0, t * 1.2);
                    ctx.bezierCurveTo(t, t, t, -t / 2, 0, t / 4);
                    ctx.fill();
                    ctx.restore();
                }
            }

            class Particula {
                constructor() {
                    this.x = Math.random() * window.innerWidth;
                    this.y = Math.random() * window.innerHeight;
                    this.destX = this.x;
                    this.destY = this.y;
                    const rojos = ['#FF0000', '#FF1111', '#E60000', '#FF2222', '#CC0000'];
                    this.color = rojos[Math.floor(Math.random() * rojos.length)];
                    this.tamano = esCelular ? (Math.random() * 1.6 + 1.1) : (Math.random() * 2.1 + 1.3);
                    this.vel = 0.14;
                }
                actualizar() {
                    this.x += (this.destX - this.x) * this.vel;
                    this.y += (this.destY - this.y) * this.vel;
                }
                dibujar() {
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#FF0000';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.tamano, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function obtenerPuntos(item) {
                const offC = document.createElement('canvas');
                const offCtx = offC.getContext('2d');
                const w = window.innerWidth;
                const h = window.innerHeight;
                offC.width = w; offC.height = h;
                offCtx.fillStyle = '#ffffff';

                if (Array.isArray(item)) {
                    let fSize = esCelular ? Math.min(w / 5.2, 42) : Math.min(w / 6.0, 64);
                    offCtx.font = `bold ${fSize}px sans-serif`;
                    offCtx.textAlign = 'center';
                    offCtx.textBaseline = 'middle';
                    let lHeight = fSize * 1.3;
                    let tHeight = lHeight * item.length;
                    let startY = (h / 2) - (tHeight / 2) + (lHeight / 2);
                    item.forEach((lin, idx) => {
                        offCtx.fillText(lin, w / 2, startY + (idx * lHeight));
                    });
                } else {
                    let fSize = esCelular ? (item.length > 8 ? Math.min(w / 4.6, 50) : Math.min(w / 3.8, 66)) : Math.min(w / 4.5, 95);
                    offCtx.font = `bold ${fSize}px sans-serif`;
                    offCtx.textAlign = 'center';
                    offCtx.textBaseline = 'middle';
                    offCtx.fillText(item, w / 2, h / 2);
                }

                const img = offCtx.getImageData(0, 0, w, h).data;
                const pts = [];
                const salto = esCelular ? 4 : 3;
                for (let y = 0; y < h; y += salto) {
                    for (let x = 0; x < w; x += salto) {
                        if (img[(y * w + x) * 4 + 3] > 128) {
                            pts.push({ x, y });
                        }
                    }
                }
                return pts;
            }

            function obtenerCorazon() {
                const pts = [];
                const cx = window.innerWidth / 2;
                const cy = window.innerHeight / 2;
                let esc = Math.min(window.innerWidth, window.innerHeight) / (esCelular ? 750 : 650);
                [70, 120, 170, 220].forEach(s => {
                    let r = s * esc;
                    for (let t = 0; t < Math.PI * 2; t += 0.06) {
                        let hx = 16 * Math.pow(Math.sin(t), 3);
                        let hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                        pts.push({ x: cx + hx * (r / 15), y: cy + hy * (r / 15) });
                    }
                });
                return pts;
            }

            const numParticulas = esCelular ? 900 : 1600;
            for (let i = 0; i < numParticulas; i++) particulas.push(new Particula());

            const lluvia = [];
            for (let i = 0; i < (esCelular ? 65 : 110); i++) lluvia.push(new Lluvia());

            function actualizarDestinos(dispersar) {
                if (dispersar) {
                    for (let p of particulas) {
                        p.destX = Math.random() * window.innerWidth;
                        p.destY = Math.random() * window.innerHeight;
                    }
                } else {
                    let actual = secuencia[indicePaso];
                    let objetivos = (actual === "CORAZON") ? obtenerCorazon() : obtenerPuntos(actual);
                    for (let i = 0; i < particulas.length; i++) {
                        if (objetivos.length > 0) {
                            let pt = objetivos[i % objetivos.length];
                            particulas[i].destX = pt.x + (Math.random() - 0.5) * 2;
                            particulas[i].destY = pt.y + (Math.random() - 0.5) * 2;
                        }
                    }
                }
            }

            actualizarDestinos(false);

            function loop() {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

                for (let est of estrellasFondo) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${est.alfa})`;
                    ctx.fillRect(est.x, est.y, est.tamano, est.tamano);
                }

                contadorFrames++;
                if (contadorFrames === duracionPaso - 45) actualizarDestinos(true);
                if (contadorFrames > duracionPaso) {
                    contadorFrames = 0;
                    indicePaso = (indicePaso + 1) % secuencia.length;
                    actualizarDestinos(false);
                }

                let esCorazon = (secuencia[indicePaso] === "CORAZON");
                for (let c of lluvia) { c.actualizar(esCorazon); c.dibujar(); }
                for (let p of particulas) { p.actualizar(); p.dibujar(); }

                requestAnimationFrame(loop);
            }
            loop();
        }
    </script>
</body>
</html>
