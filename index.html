<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sorpresa - 21 de Septiembre</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }

        /* Pantalla de inicio */
        #pantalla-inicio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* Grupo interactivo (botón + texto que se mueven juntos) */
        #grupo-interactivo {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }

        #boton-inicio {
            padding: 18px 40px;
            font-size: 22px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            transition: all 0.3s ease;
        }

        #boton-inicio:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.9);
        }

        #texto-intentos {
            margin-top: 20px;
            color: #aaa;
            font-size: 15px;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Pantalla de lluvia de corazones */
        #espacio-lluvia {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }

        /* Estilo de corazones multicolores hechos con CSS puro */
        .corazon {
            position: absolute;
            width: 16px;
            height: 16px;
            transform: rotate(45deg);
            animation: caidaLluvia linear infinite;
        }

        .corazon::before,
        .corazon::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: inherit;
        }

        .corazon::before {
            top: -8px;
            left: 0;
        }

        .corazon::after {
            top: 0;
            left: -8px;
        }

        @keyframes caidaLluvia {
            0% {
                transform: translateY(-80px) rotate(45deg);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(405deg);
                opacity: 0.85;
            }
        }
    </style>
</head>
<body>

    <!-- Pantalla inicial con los 3 intentos -->
    <div id="pantalla-inicio">
        <div id="grupo-interactivo">
            <button id="boton-inicio">Presiona aquí ✨</button>
            <div id="texto-intentos">Toca para descubrir algo especial</div>
        </div>
    </div>

    <!-- Pantalla con fondo negro y lluvia de corazones -->
    <div id="espacio-lluvia"></div>

    <script>
        const grupoInteractivo = document.getElementById('grupo-interactivo');
        const botonInicio = document.getElementById('boton-inicio');
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const espacioLluvia = document.getElementById('espacio-lluvia');
        const textoIntentos = document.getElementById('texto-intentos');

        let intentos = 0;

        botonInicio.addEventListener('click', function() {
            intentos++;

            if (intentos === 1) {
                grupoInteractivo.style.transform = 'translate(110px, -70px)';
                textoIntentos.innerText = "¡Uy, casi! Intenta de nuevo 😜";
            } 
            else if (intentos === 2) {
                grupoInteractivo.style.transform = 'translate(-110px, 80px)';
                textoIntentos.innerText = "¡Otra vez fallaste! Jaja 😂";
            } 
            else if (intentos >= 3) {
                pantallaInicio.style.display = 'none';
                espacioLluvia.style.display = 'block';
                iniciarLluviaDeCorazones();
            }
        });

        function iniciarLluviaDeCorazones() {
            // Lista de colores vibrantes y bonitos (sin negro)
            const colores = ['#FF1493', '#FF69B4', '#FF4500', '#FFD700', '#00FFFF', '#FF6347', '#DA70D6', '#00FF7F'];
            const cantidad = 65; 

            for (let i = 0; i < cantidad; i++) {
                const corazon = document.createElement('div');
                corazon.classList.add('corazon');

                // Asignar un color aleatorio de la lista
                const colorAleatorio = colores[Math.floor(Math.random() * colores.length)];
                corazon.style.backgroundColor = colorAleatorio;

                // Posición horizontal totalmente aleatoria
                corazon.style.left = Math.random() * 100 + 'vw';
                
                // Distribuidos a diferentes alturas por encima de la pantalla para evitar líneas
                corazon.style.top = (Math.random() * -300 - 50) + 'px';

                // Velocidad de caída fluida y natural tipo lluvia
                const duracion = Math.random() * 3 + 2.5; // Entre 2.5 y 5.5 segundos
                corazon.style.animationDuration = duracion + 's';
                corazon.style.animationDelay = (Math.random() * 5) + 's';

                espacioLluvia.appendChild(corazon);
            }
        }
    </script>

</body>
</html>
