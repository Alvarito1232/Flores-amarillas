<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sorpresa Romántica - 21 de Septiembre</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }

        /* Pantalla de inicio */
        #pantalla-inicio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #grupo-interactivo {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }

        #boton-inicio {
            padding: 18px 40px;
            font-size: 22px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            transition: all 0.3s ease;
        }

        #boton-inicio:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.9);
        }

        #texto-intentos {
            margin-top: 20px;
            color: #aaa;
            font-size: 15px;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Pantalla principal de la sorpresa */
        #espacio-sorpresa {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }

        /* Lluvia de corazones de colores */
        .corazon-lluvia {
            position: absolute;
            width: 16px;
            height: 16px;
            transform: rotate(45deg);
            animation: caidaLluvia linear infinite;
        }

        .corazon-lluvia::before,
        .corazon-lluvia::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: inherit;
        }

        .corazon-lluvia::before { top: -8px; left: 0; }
        .corazon-lluvia::after { top: 0; left: -8px; }

        @keyframes caidaLluvia {
            0% { transform: translateY(-40px) rotate(45deg); opacity: 0; }
            15% { opacity: 1; }
            100% { transform: translateY(105vh) rotate(405deg); opacity: 0.9; }
        }

        /* Contenedor central para el efecto de corazones anidados del video */
        #centro-animacion {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        /* Corazones gigantes en el centro que pulsan imitando el video */
        .corazon-central {
            position: absolute;
            border: 2px dashed rgba(255, 64, 129, 0.7);
            background: rgba(255, 20, 147, 0.15);
            transform: rotate(45deg);
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.5);
            animation: latidoCentro 2s infinite ease-in-out;
        }

        .corazon-central::before,
        .corazon-central::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: inherit;
            border: inherit;
        }

        /* Tamaños escalonados para hacer el efecto de varios corazones dentro de otros */
        .c1 { width: 80px; height: 80px; animation-delay: 0s; }
        .c1::before { width: 80px; height: 80px; top: -40px; left: 0; }
        .c1::after { width: 80px; height: 80px; top: 0; left: -40px; }

        .c2 { width: 150px; height: 150px; animation-delay: 0.3s; }
        .c2::before { width: 150px; height: 150px; top: -75px; left: 0; }
        .c2::after { width: 150px; height: 150px; top: 0; left: -75px; }

        .c3 { width: 220px; height: 220px; animation-delay: 0.6s; }
        .c3::before { width: 220px; height: 220px; top: -110px; left: 0; }
        .c3::after { width: 220px; height: 220px; top: 0; left: -110px; }

        @keyframes latidoCentro {
            0%, 100% {
                transform: scale(1) rotate(45deg);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.12) rotate(45deg);
                opacity: 1;
                box-shadow: 0 0 35px rgba(255, 105, 180, 0.9);
            }
        }

        /* Texto frontal opcional dentro del corazón central */
        #texto-central {
            position: absolute;
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px #FF1493;
            letter-spacing: 2px;
            z-index: 6;
            animation: latidoCentro 2s infinite ease-in-out;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="pantalla-inicio">
        <div id="grupo-interactivo">
            <button id="boton-inicio">Presiona aquí ✨</button>
            <div id="texto-intentos">Toca para descubrir algo especial</div>
        </div>
    </div>

    <div id="espacio-sorpresa">
        <div id="centro-animacion">
            <div class="corazon-central c3"></div>
            <div class="corazon-central c2"></div>
            <div class="corazon-central c1"></div>
            <div id="texto-central">Mi Niña ❤️</div>
        </div>
    </div>

    <script>
        const grupoInteractivo = document.getElementById('grupo-interactivo');
        const botonInicio = document.getElementById('boton-inicio');
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const espacioSorpresa = document.getElementById('espacio-sorpresa');
        const textoIntentos = document.getElementById('texto-intentos');

        let intentos = 0;

        botonInicio.addEventListener('click', function() {
            intentos++;

            if (intentos === 1) {
                grupoInteractivo.style.transform = 'translate(110px, -70px)';
                textoIntentos.innerText = "¡Uy, casi! Intenta de nuevo 😜";
            } 
            else if (intentos === 2) {
                grupoInteractivo.style.transform = 'translate(-110px, 80px)';
                textoIntentos.innerText = "¡Otra vez fallaste! Jaja 😂";
            } 
            else if (intentos >= 3) {
                pantallaInicio.style.display = 'none';
                espacioSorpresa.style.display = 'block';
                iniciarLluviaDeCorazones();
            }
        });

        function iniciarLluviaDeCorazones() {
            const colores = ['#FF1744', '#FF4081', '#E91E63', '#FF5252', '#FF80AB', '#FFD700', '#FFA000', '#FFFFFF'];
            const cantidad = 60; 

            for (let i = 0; i < cantidad; i++) {
                const corazon = document.createElement('div');
                corazon.classList.add('corazon-lluvia');

                corazon.style.backgroundColor = colores[Math.floor(Math.random() * colores.length)];
                corazon.style.left = Math.random() * 100 + 'vw';
                corazon.style.top = (Math.random() * -100 - 20) + 'px';

                const duracion = Math.random() * 2 + 1.5; 
                corazon.style.animationDuration = duracion + 's';
                corazon.style.animationDelay = (Math.random() * 2) + 's';

                espacioSorpresa.appendChild(corazon);
            }
        }
    </script>

</body>
</html>
