<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flores Amarillas - 21 de Septiembre</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }

        /* Pantalla de inicio */
        #pantalla-inicio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* Grupo interactivo (botón + texto que se mueven juntos) */
        #grupo-interactivo {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }

        #boton-inicio {
            padding: 18px 40px;
            font-size: 22px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            transition: all 0.3s ease;
        }

        #boton-inicio:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.9);
        }

        #texto-intentos {
            margin-top: 20px;
            color: #aaa;
            font-size: 15px;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Pantalla de lluvia de flores */
        #espacio-lluvia {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }

        /* Flor de 5 pétalos hecha con código (Inspirada en tu foto) */
        .flor {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 10px #FFD700;
            animation: caidaLluvia linear infinite;
        }

        /* Pétalos distribuidos alrededor para formar la flor */
        .flor::before, .flor::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #FFD700;
            border-radius: 50%;
        }

        .flor::before {
            top: -10px;
            left: -5px;
            box-shadow: 10px 0 0 #FFD700;
        }

        .flor::after {
            top: 5px;
            left: -10px;
            box-shadow: 0 10px 0 #FFD700, 10px 10px 0 #FFD700;
        }

        @keyframes caidaLluvia {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.9;
            }
        }
    </style>
</head>
<body>

    <!-- Pantalla inicial con los 3 intentos -->
    <div id="pantalla-inicio">
        <div id="grupo-interactivo">
            <button id="boton-inicio">Presiona aquí ✨</button>
            <div id="texto-intentos">Toca para descubrir algo especial</div>
        </div>
    </div>

    <!-- Pantalla con fondo negro y lluvia de flores -->
    <div id="espacio-lluvia"></div>

    <script>
        const grupoInteractivo = document.getElementById('grupo-interactivo');
        const botonInicio = document.getElementById('boton-inicio');
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const espacioLluvia = document.getElementById('espacio-lluvia');
        const textoIntentos = document.getElementById('texto-intentos');

        let intentos = 0;

        botonInicio.addEventListener('click', function() {
            intentos++;

            if (intentos === 1) {
                grupoInteractivo.style.transform = 'translate(110px, -70px)';
                textoIntentos.innerText = "¡Uy, casi! Intenta de nuevo 😜";
            } 
            else if (intentos === 2) {
                grupoInteractivo.style.transform = 'translate(-110px, 80px)';
                textoIntentos.innerText = "¡Otra vez fallaste! Jaja 😂";
            } 
            else if (intentos >= 3) {
                pantallaInicio.style.display = 'none';
                espacioLluvia.style.display = 'block';
                iniciarLluviaDeFlores();
            }
        });

        function iniciarLluviaDeFlores() {
            const cantidad = 70; // Cantidad de flores en la lluvia
            for (let i = 0; i < cantidad; i++) {
                const flor = document.createElement('div');
                flor.classList.add('flor');

                // Posición horizontal aleatoria por toda la pantalla
                flor.style.left = Math.random() * 100 + 'vw';
                
                // Empiezan arriba de la pantalla de forma escalonada para que no salgan en fila
                flor.style.top = (Math.random() * -50) - 20 + 'px';

                // Velocidad de caída fluida tipo lluvia
                const duracion = Math.random() * 3 + 2; // Entre 2 y 5 segundos
                flor.style.animationDuration = duracion + 's';
                flor.style.animationDelay = (Math.random() * 5) + 's';

                espacioLluvia.appendChild(flor);
            }
        }
    </script>

</body>
</html>
