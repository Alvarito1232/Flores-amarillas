<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flores Amarillas - 21 de Septiembre</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }

        /* Pantalla de inicio */
        #pantalla-inicio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #boton-inicio {
            padding: 18px 40px;
            font-size: 22px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            transition: all 0.3s ease;
            position: relative;
        }

        #boton-inicio:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.9);
        }

        #texto-intentos {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* Pantalla de lluvia de flores */
        #espacio-lluvia {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }

        /* Estilo de las flores hechas con código puro cayendo en lluvia */
        .flor {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 8px #FFD700, 0 0 15px #FFA500;
            animation: caidaLluvia linear infinite;
        }

        @keyframes caidaLluvia {
            0% {
                transform: translateY(-20px) rotate(0deg);
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- Pantalla inicial con los 3 intentos -->
    <div id="pantalla-inicio">
        <button id="boton-inicio">Presiona aquí ✨</button>
        <div id="texto-intentos">Toca para descubrir algo especial</div>
    </div>

    <!-- Pantalla con fondo negro y lluvia de flores -->
    <div id="espacio-lluvia"></div>

    <script>
        const botonInicio = document.getElementById('boton-inicio');
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const espacioLluvia = document.getElementById('espacio-lluvia');
        const textoIntentos = document.getElementById('texto-intentos');

        let intentos = 0;

        botonInicio.addEventListener('click', function() {
            intentos++;

            if (intentos === 1) {
                botonInicio.style.transform = 'translate(110px, -70px)';
                textoIntentos.innerText = "¡Uy, casi! Intenta de nuevo 😜";
            } 
            else if (intentos === 2) {
                botonInicio.style.transform = 'translate(-110px, 80px)';
                textoIntentos.innerText = "¡Otra vez fallaste! Jaja 😂";
            } 
            else if (intentos >= 3) {
                pantallaInicio.style.display = 'none';
                espacioLluvia.style.display = 'block';
                iniciarLluviaDeFlores();
            }
        });

        function iniciarLluviaDeFlores() {
            const cantidad = 80; // ¡Bastantes flores cayendo en tipo lluvia!
            for (let i = 0; i < cantidad; i++) {
                const flor = document.createElement('div');
                flor.classList.add('flor');

                // Posición horizontal aleatoria
                flor.style.left = Math.random() * 100 + 'vw';
                
                // Velocidad de caída rápida y fluida para simular lluvia
                const duracion = Math.random() * 2 + 2; // Entre 2 y 4 segundos
                flor.style.animationDuration = duracion + 's';
                flor.style.animationDelay = (Math.random() * 4) + 's';

                espacioLluvia.appendChild(flor);
            }
        }
    </script>

</body>
</html>
