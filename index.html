<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flores Amarillas - 21 de Septiembre</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }

        /* Pantalla de inicio */
        #pantalla-inicio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #boton-inicio {
            padding: 18px 40px;
            font-size: 22px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            transition: all 0.3s ease;
            position: relative;
        }

        #boton-inicio:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.9);
        }

        #texto-intentos {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* Pantalla principal con efecto gravedad cero y caída */
        #espacio-efecto {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }

        /* Estilo para las flores que flotan y caen */
        .flor {
            position: absolute;
            width: 18px;
            height: 18px;
            background-image: url('https://cdn-icons-png.flaticon.com/512/183/183801.png');
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.85;
            animation: efectoGravedadYCaida linear infinite;
        }

        @keyframes efectoGravedadYCaida {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            30% {
                /* Primero flotan libremente como en gravedad cero */
                transform: translate(40px, -50px) rotate(90deg);
            }
            60% {
                transform: translate(-30px, -20px) rotate(180deg);
            }
            100% {
                /* Y luego empiezan a caer hacia abajo */
                transform: translate(10px, 105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- Pantalla inicial con los 3 intentos del botón -->
    <div id="pantalla-inicio">
        <button id="boton-inicio">Presiona aquí ✨</button>
        <div id="texto-intentos">Toca para descubrir algo especial</div>
    </div>

    <!-- Pantalla con fondo negro y el efecto de flores -->
    <div id="espacio-efecto"></div>

    <script>
        const botonInicio = document.getElementById('boton-inicio');
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const espacioEfecto = document.getElementById('espacio-efecto');
        const textoIntentos = document.getElementById('texto-intentos');

        let intentos = 0;

        botonInicio.addEventListener('click', function() {
            intentos++;

            if (intentos === 1) {
                botonInicio.style.transform = 'translate(100px, -80px)';
                textoIntentos.innerText = "¡Uy, casi! Intenta de nuevo 😜";
            } 
            else if (intentos === 2) {
                botonInicio.style.transform = 'translate(-120px, 90px)';
                textoIntentos.innerText = "¡Otra vez fallaste! Jaja 😂";
            } 
            else if (intentos >= 3) {
                pantallaInicio.style.display = 'none';
                espacioEfecto.style.display = 'block';
                iniciarEfectoFlores();
            }
        });

        function iniciarEfectoFlores() {
            const cantidad = 60; // Bastantes flores en pantalla
            for (let i = 0; i < cantidad; i++) {
                const flor = document.createElement('div');
                flor.classList.add('flor');

                // Posición aleatoria en la pantalla
                flor.style.left = Math.random() * 100 + 'vw';
                flor.style.top = (Math.random() * 50) + 'vh';

                // Duración de la animación variada para que se vea natural
                const duracion = Math.random() * 4 + 4; // Entre 4 y 8 segundos
                flor.style.animationDuration = duracion + 's';
                flor.style.animationDelay = (Math.random() * 5) + 's';

                espacioEfecto.appendChild(flor);
            }
        }
    </script>

</body>
</html>
