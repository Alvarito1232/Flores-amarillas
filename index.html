<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sorpresa Galaxia - 21 de Septiembre</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }

        /* Pantalla de inicio con los 3 intentos */
        #pantalla-inicio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #grupo-interactivo {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }

        #boton-inicio {
            padding: 18px 40px;
            font-size: 22px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            transition: all 0.3s ease;
        }

        #boton-inicio:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.9);
        }

        #texto-intentos {
            margin-top: 20px;
            color: #aaa;
            font-size: 15px;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Pantalla de la animación de partículas */
        #espacio-animacion {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="pantalla-inicio">
        <div id="grupo-interactivo">
            <button id="boton-inicio">Presiona aquí ✨</button>
            <div id="texto-intentos">Toca para descubrir algo especial</div>
        </div>
    </div>

    <div id="espacio-animacion">
        <canvas id="canvasParticulas"></canvas>
    </div>

    <script>
        const grupoInteractivo = document.getElementById('grupo-interactivo');
        const botonInicio = document.getElementById('boton-inicio');
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const espacioAnimacion = document.getElementById('espacio-animacion');
        const textoIntentos = document.getElementById('texto-intentos');

        let intentos = 0;

        botonInicio.addEventListener('click', function() {
            intentos++;

            if (intentos === 1) {
                grupoInteractivo.style.transform = 'translate(110px, -70px)';
                textoIntentos.innerText = "¡Uy, casi! Intenta de nuevo 😜";
            } 
            else if (intentos === 2) {
                grupoInteractivo.style.transform = 'translate(-110px, 80px)';
                textoIntentos.innerText = "¡Otra vez fallaste! Jaja 😂";
            } 
            else if (intentos >= 3) {
                pantallaInicio.style.display = 'none';
                espacioAnimacion.style.display = 'block';
                iniciarEfectoParticulas();
            }
        });

        function iniciarEfectoParticulas() {
            const canvas = document.getElementById('canvasParticulas');
            const ctx = canvas.getContext('2d');

            function ajustarCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            ajustarCanvas();
            window.addEventListener('resize', ajustarCanvas);

            // Textos y formas por los que pasará la secuencia de partículas
            const pasos = [
                { texto: "Te amo", tipo: "texto" },
                { texto: "Mi niña", tipo: "texto" },
                { texto: "Preciosa", tipo: "texto" },
                { texto: "Gracias por existir", tipo: "texto" },
                { tipo: "corazones" } // Secuencia final de corazones anidados
            ];

            let pasoActual = 0;
            let particulas = [];
            let contadorFrames = 0;
            const duracionPorPaso = 220; // Tiempo que dura cada frase en frames

            // Generar puntos de texto usando un canvas temporal
            function obtenerPuntosTexto(str) {
                const tempCanvas = document.createElement('canvas');
                const tCtx = tempCanvas.getContext('2d');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;

                tCtx.fillStyle = 'white';
                let fontSize = Math.min(canvas.width / 7, 90);
                tCtx.font = `bold ${fontSize}px sans-serif`;
                tCtx.textAlign = 'center';
                tCtx.textBaseline = 'middle';
                tCtx.fillText(str, tempCanvas.width / 2, tempCanvas.height / 2);

                const imgData = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const puntos = [];
                const salto = 4; // Densidad de partículas

                for (let y = 0; y < tempCanvas.height; y += salto) {
                    for (let x = 0; x < tempCanvas.width; x += salto) {
                        const index = (y * tempCanvas.width + x) * 4;
                        if (imgData.data[index + 3] > 128) {
                            puntos.push({ x: x, y: y });
                        }
                    }
                }
                return puntos;
            }

            // Generar puntos para la figura de corazones anidados del centro
            function obtenerPuntosCorazones() {
                const puntos = [];
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                
                // Múltiples capas de corazones
                [70, 130, 190].forEach(escala => {
                    for (let t = 0; t < Math.PI * 2; t += 0.05) {
                        // Ecuación paramétrica del corazón
                        let hx = 16 * Math.pow(Math.sin(t), 3);
                        let hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                        
                        puntos.push({
                            x: cx + hx * (escala / 16),
                            y: cy + hy * (escala / 16)
                        });
                    }
                });
                return puntos;
            }

            // Inicializar partículas flotando al azar
            class Particula {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.destinoX = this.x;
                    this.destinoY = this.y;
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = (Math.random() - 0.5) * 2;
                    this.color = Math.random() < 0.2 ? '#ffffff' : '#FF1744';
                    this.tamano = Math.random() * 2 + 1.5;
                }

                actualizar() {
                    // Moverse hacia el objetivo de la palabra o figura
                    let dx = this.destinoX - this.x;
                    let dy = this.destinoY - this.y;
                    this.x += dx * 0.08;
                    this.y += dy * 0.08;

                    // Si estamos flotando libremente al inicio o transición
                    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) {
                        this.x += this.vx;
                        this.y += this.vy;
                    }
                }

                dibujar() {
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#FF4081';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.tamano, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Crear grupo de partículas
            const totalParticulas = 1200;
            for (let i = 0; i < totalParticulas; i++) {
                particulas.push(new Particula());
            }

            function cambiarObjetivo() {
                let puntosObjetivo = [];
                if (pasos[pasoActual].tipo === "texto") {
                    puntosObjetivo = obtenerPuntosTexto(pasos[pasoActual].texto);
                } else {
                    puntosObjetivo = obtenerPuntosCorazones();
                }

                // Asignar los puntos a las partículas de forma fluida
                for (let i = 0; i < particulas.length; i++) {
                    let punto = puntosObjetivo[i % puntosObjetivo.length];
                    if (punto) {
                        // Agregar ligera dispersión aleatoria alrededor de la letra/figura
                        particulas[i].destinoX = punto + (Math.random() - 0.5) * 6;
                        particulas[i].destinoY = punto.y + (Math.random() - 0.5) * 6;
                    }
                }
            }

            cambiarObjetivo();

            // Bucle principal de animación
            function animar() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.25)'; // Estela suave estilo galaxia
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                contadorFrames++;
                if (contadorFrames > duracionPorPaso) {
                    contadorFrames = 0;
                    pasoActual = (pasoActual + 1) % pasos.length;
                    cambiarObjetivo();
                }

                for (let p of particulas) {
                    p.actualizar();
                    p.dibujar();
                }

                requestAnimationFrame(animar);
            }

            animar();
        }
    </script>

</body>
</html>
