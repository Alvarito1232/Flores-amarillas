<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sorpresa Romántica Definitiva</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }

        /* Pantalla de inicio con los 3 intentos */
        #pantalla-inicio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: #000;
        }

        #grupo-interactivo {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }

        #boton-inicio {
            padding: 18px 40px;
            font-size: 22px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            transition: all 0.3s ease;
        }

        #boton-inicio:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.9);
        }

        #texto-intentos {
            margin-top: 20px;
            color: #aaa;
            font-size: 15px;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Pantalla de animación de partículas con fondo negro */
        #espacio-animacion {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="pantalla-inicio">
        <div id="grupo-interactivo">
            <button id="boton-inicio">Presiona aquí ✨</button>
            <div id="texto-intentos">Toca para descubrir algo especial</div>
        </div>
    </div>

    <div id="espacio-animacion">
        <canvas id="canvasSorpresa"></canvas>
    </div>

    <script>
        const grupoInteractivo = document.getElementById('grupo-interactivo');
        const botonInicio = document.getElementById('boton-inicio');
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const espacioAnimacion = document.getElementById('espacio-animacion');
        const textoIntentos = document.getElementById('texto-intentos');

        let intentos = 0;

        botonInicio.addEventListener('click', function() {
            intentos++;

            if (intentos === 1) {
                grupoInteractivo.style.transform = 'translate(110px, -70px)';
                textoIntentos.innerText = "¡Uy, casi! Intenta de nuevo 😜";
            } 
            else if (intentos === 2) {
                grupoInteractivo.style.transform = 'translate(-110px, 80px)';
                textoIntentos.innerText = "¡Otra vez fallaste! Jaja 😂";
            } 
            else if (intentos >= 3) {
                pantallaInicio.style.display = 'none';
                espacioAnimacion.style.display = 'block';
                iniciarSorpresaTotal();
            }
        });

        function iniciarSorpresaTotal() {
            const canvas = document.getElementById('canvasSorpresa');
            const ctx = canvas.getContext('2d');

            function ajustarCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            ajustarCanvas();
            window.addEventListener('resize', ajustarCanvas);

            const secuencia = [
                "Te amo",
                "Mi niña",
                "Preciosa",
                "Gracias por existir",
                "CORAZON"
            ];

            let indicePaso = 0;
            let particulasTexto = [];
            let contadorFrames = 0;
            const duracionPaso = 210; // Tiempo fluido para cada frase

            // Lluvia de corazones más rápida y abundante
            class CorazonLluvia {
                constructor() {
                    this.reiniciar();
                }

                reiniciar() {
                    this.x = Math.random() * canvas.width;
                    this.y = -30 - Math.random() * 200;
                    this.vy = Math.random() * 3.5 + 2.5; // Caída más rápida tipo lluvia intensa
                    this.vx = (Math.random() - 0.5) * 2;
                    this.tamano = Math.random() * 7 + 6;
                    const colores = ['#FF1744', '#FF4081', '#FF5252', '#FF80AB', '#FFD700', '#FFFFFF', '#00E676'];
                    this.color = colores[Math.floor(Math.random() * colores.length)];
                    this.rotacion = Math.random() * Math.PI;
                    this.vRot = (Math.random() - 0.5) * 0.08;
                }

                actualizar(esCorazonActivo) {
                    this.y += this.vy;
                    this.x += this.vx;
                    this.rotacion += this.vRot;

                    let centroX = canvas.width / 2;
                    let centroY = canvas.height / 2;

                    // Detección de colisión inteligente según el paso actual
                    let colisiona = false;
                    if (esCorazonActivo) {
                        // Colisión para la forma de los corazones anidados (área más amplia)
                        let dx = Math.abs(this.x - centroX);
                        let dy = Math.abs(this.y - centroY);
                        if (dx < 170 && dy < 170) colisiona = true;
                    } else {
                        // Colisión para las palabras horizontales
                        if (this.y > centroY - 45 && this.y < centroY + 45 &&
                            this.x > centroX - 200 && this.x < centroX + 200) {
                            colisiona = true;
                        }
                    }

                    if (colisiona) {
                        // Rebote dinámico hacia los costados para no atravesar el texto/figura
                        if (this.x < centroX) {
                            this.vx = -4.5;
                            this.x -= 5;
                        } else {
                            this.vx = 4.5;
                            this.x += 5;
                        }
                        this.y -= 1;
                    }

                    // Reciclar si sale de la pantalla
                    if (this.y > canvas.height + 40 || this.x < -60 || this.x > canvas.width + 60) {
                        this.reiniciar();
                    }
                }

                dibujar() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotacion);
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = this.color;

                    ctx.beginPath();
                    let t = this.tamano;
                    ctx.moveTo(0, t / 4);
                    ctx.bezierCurveTo(-t, -t / 2, -t, t, 0, t * 1.2);
                    ctx.bezierCurveTo(t, t, t, -t / 2, 0, t / 4);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // Partículas de las palabras y corazones centrales
            class ParticulaTexto {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.destinoX = this.x;
                    this.destinoY = this.y;
                    this.color = Math.random() < 0.2 ? '#ffffff' : '#ff1744';
                    this.tamano = Math.random() * 2 + 1.2;
                    this.velocidad = 0.09; // Movimiento fluido hacia la posición
                }

                actualizar() {
                    let dx = this.destinoX - this.x;
                    let dy = this.destinoY - this.y;
                    this.x += dx * this.velocidad;
                    this.y += dy * this.velocidad;
                }

                dibujar() {
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#ff1744';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.tamano, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function obtenerPuntosTexto(texto) {
                const offScreenCanvas = document.createElement('canvas');
                const offCtx = offScreenCanvas.getContext('2d');
                offScreenCanvas.width = canvas.width;
                offScreenCanvas.height = canvas.height;

                offCtx.fillStyle = '#ffffff';
                let fontSize = Math.min(canvas.width / 6, 85);
                offCtx.font = `bold ${fontSize}px sans-serif`;
                offCtx.textAlign = 'center';
                offCtx.textBaseline = 'middle';
                offCtx.fillText(texto, offScreenCanvas.width / 2, offScreenCanvas.height / 2);

                const imgData = offCtx.getImageData(0, 0, offScreenCanvas.width, offScreenCanvas.height);
                const puntos = [];
                const salto = 5;

                for (let y = 0; y < offScreenCanvas.height; y += salto) {
                    for (let x = 0; x < offScreenCanvas.width; x += salto) {
                        const index = (y * offScreenCanvas.width + x) * 4;
                        if (imgData.data[index + 3] > 128) {
                            puntos.push({ x: x, y: y });
                        }
                    }
                }
                return puntos;
            }

            function obtenerPuntosCorazon() {
                const puntos = [];
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;

                [60, 110, 160, 210].forEach(escala => {
                    for (let t = 0; t < Math.PI * 2; t += 0.08) {
                        let hx = 16 * Math.pow(Math.sin(t), 3);
                        let hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                        puntos.push({
                            x: cx + hx * (escala / 15),
                            y: cy + hy * (escala / 15)
                        });
                    }
                });
                return puntos;
            }

            const totalParticulas = 1400;
            for (let i = 0; i < totalParticulas; i++) {
                particulasTexto.push(new ParticulaTexto());
            }

            // Aumentamos la cantidad de corazones en la lluvia para que se vea más lleno y rápido
            const totalCorazonesLluvia = 65;
            let lluvia = [];
            for (let i = 0; i < totalCorazonesLluvia; i++) {
                lluvia.push(new CorazonLluvia());
            }

            function actualizarDestinos() {
                let actual = secuencia[indicePaso];
                let puntosObjetivo = (actual === "CORAZON") ? obtenerPuntosCorazon() : obtenerPuntosTexto(actual);

                for (let i = 0; i < particulasTexto.length; i++) {
                    if (puntosObjetivo.length > 0) {
                        let pt = puntosObjetivo[i % puntosObjetivo.length];
                        particulasTexto[i].destinoX = pt.x + (Math.random() - 0.5) * 4;
                        particulasTexto[i].destinoY = pt.y + (Math.random() - 0.5) * 4;
                    }
                }
            }

            actualizarDestinos();

            function animar() {
                // Fondo totalmente negro y limpio con estela ligera
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                contadorFrames++;
                if (contadorFrames > duracionPaso) {
                    contadorFrames = 0;
                    indicePaso = (indicePaso + 1) % secuencia.length;
                    actualizarDestinos();
                }

                let esCorazonActivo = (secuencia[indicePaso] === "CORAZON");

                // Actualizar y dibujar lluvia de corazones rápida con colisión corregida
                for (let c of lluvia) {
                    c.actualizar(esCorazonActivo);
                    c.dibujar();
                }

                // Actualizar y dibujar partículas centrales
                for (let p of particulasTexto) {
                    p.actualizar();
                    p.dibujar();
                }

                requestAnimationFrame(animar);
            }

            animar();
        }
    </script>

</body>
</html>
