<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sorpresa Galaxia - 21 de Septiembre</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }

        /* Pantalla de inicio con los 3 intentos */
        #pantalla-inicio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: #000;
        }

        #grupo-interactivo {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }

        #boton-inicio {
            padding: 18px 40px;
            font-size: 22px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            transition: all 0.3s ease;
        }

        #boton-inicio:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.9);
        }

        #texto-intentos {
            margin-top: 20px;
            color: #aaa;
            font-size: 15px;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Pantalla de la animación de partículas */
        #espacio-animacion {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="pantalla-inicio">
        <div id="grupo-interactivo">
            <button id="boton-inicio">Presiona aquí ✨</button>
            <div id="texto-intentos">Toca para descubrir algo especial</div>
        </div>
    </div>

    <div id="espacio-animacion">
        <canvas id="canvasParticulas"></canvas>
    </div>

    <script>
        const grupoInteractivo = document.getElementById('grupo-interactivo');
        const botonInicio = document.getElementById('boton-inicio');
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const espacioAnimacion = document.getElementById('espacio-animacion');
        const textoIntentos = document.getElementById('texto-intentos');

        let intentos = 0;

        botonInicio.addEventListener('click', function() {
            intentos++;

            if (intentos === 1) {
                grupoInteractivo.style.transform = 'translate(110px, -70px)';
                textoIntentos.innerText = "¡Uy, casi! Intenta de nuevo 😜";
            } 
            else if (intentos === 2) {
                grupoInteractivo.style.transform = 'translate(-110px, 80px)';
                textoIntentos.innerText = "¡Otra vez fallaste! Jaja 😂";
            } 
            else if (intentos >= 3) {
                pantallaInicio.style.display = 'none';
                espacioAnimacion.style.display = 'block';
                iniciarEfectoParticulas();
            }
        });

        function iniciarEfectoParticulas() {
            const canvas = document.getElementById('canvasParticulas');
            const ctx = canvas.getContext('2d');

            function ajustarCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            ajustarCanvas();
            window.addEventListener('resize', ajustarCanvas);

            // Secuencia exacta de palabras y figura final
            const secuencia = [
                "Te amo",
                "Mi niña",
                "Preciosa",
                "Gracias por existir",
                "CORAZON" // Identificador para la figura final
            ];

            let indicePaso = 0;
            let particulas = [];
            let contadorFrames = 0;
            const duracionPaso = 180; // Tiempo que se queda fija cada frase antes de cambiar

            // Obtener coordenadas de píxeles para el texto
            function obtenerPuntosTexto(texto) {
                const offScreenCanvas = document.createElement('canvas');
                const offCtx = offScreenCanvas.getContext('2d');
                offScreenCanvas.width = canvas.width;
                offScreenCanvas.height = canvas.height;

                offCtx.fillStyle = '#ffffff';
                let fontSize = Math.min(canvas.width / 6, 85);
                offCtx.font = `bold ${fontSize}px sans-serif`;
                offCtx.textAlign = 'center';
                offCtx.textBaseline = 'middle';
                offCtx.fillText(texto, offScreenCanvas.width / 2, offScreenCanvas.height / 2);

                const imgData = offCtx.getImageData(0, 0, offScreenCanvas.width, offScreenCanvas.height);
                const puntos = [];
                const salto = 5; // Salto para capturar los puntos de la letra

                for (let y = 0; y < offScreenCanvas.height; y += salto) {
                    for (let x = 0; x < offScreenCanvas.width; x += salto) {
                        const index = (y * offScreenCanvas.width + x) * 4;
                        if (imgData.data[index + 3] > 128) {
                            puntos.push({ x: x, y: y });
                        }
                    }
                }
                return puntos;
            }

            // Obtener coordenadas para los corazones anidados del centro
            function obtenerPuntosCorazon() {
                const puntos = [];
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;

                [60, 110, 160, 210].forEach(escala => {
                    for (let t = 0; t < Math.PI * 2; t += 0.08) {
                        let hx = 16 * Math.pow(Math.sin(t), 3);
                        let hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                        puntos.push({
                            x: cx + hx * (escala / 15),
                            y: cy + hy * (escala / 15)
                        });
                    }
                });
                return puntos;
            }

            class Particula {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.destinoX = this.x;
                    this.destinoY = this.y;
                    this.color = Math.random() < 0.15 ? '#ffffff' : '#ff1744';
                    this.tamano = Math.random() * 2 + 1.2;
                    this.velocidad = 0.07; // Velocidad de atracción hacia el objetivo
                }

                actualizar() {
                    let dx = this.destinoX - this.x;
                    let dy = this.destinoY - this.y;
                    this.x += dx * this.velocidad;
                    this.y += dy * this.velocidad;
                }

                dibujar() {
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = '#ff4081';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.tamano, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Crear las partículas (ej. 1400 partículas para alta definición)
            const totalParticulas = 1400;
            for (let i = 0; i < totalParticulas; i++) {
                particulas.push(new Particula());
            }

            function actualizarDestinos() {
                let actual = secuencia[indicePaso];
                let puntosObjetivo = [];

                if (actual === "CORAZON") {
                    puntosObjetivo = obtenerPuntosCorazon();
                } else {
                    puntosObjetivo = obtenerPuntosTexto(actual);
                }

                // Si no hay suficientes puntos de texto, replicamos algunos para cubrir todas las partículas
                for (let i = 0; i < particulas.length; i++) {
                    if (puntosObjetivo.length > 0) {
                        let pt = puntosObjetivo[i % puntosObjetivo.length];
                        particulas[i].destinoX = pt.x + (Math.random() - 0.5) * 4;
                        particulas[i].destinoY = pt.y + (Math.random() - 0.5) * 4;
                    }
                }
            }

            actualizarDestinos();

            function animar() {
                // Borrar pantalla con un negro semi-transparente para dejar estela suave
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                contadorFrames++;
                if (contadorFrames > duracionPaso) {
                    contadorFrames = 0;
                    indicePaso = (indicePaso + 1) % secuencia.length;
                    actualizarDestinos();
                }

                for (let p of particulas) {
                    p.actualizar();
                    p.dibujar();
                }

                requestAnimationFrame(animar);
            }

            animar();
        }
    </script>

</body>
</html>
