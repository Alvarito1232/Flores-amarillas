<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorpresa Romántica Definitiva</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }

        /* Pantalla de inicio espacial con estrellas y fugaces */
        #pantalla-inicio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: radial-gradient(circle at center, #1a001a 0%, #000000 100%);
            overflow: hidden;
            padding: 15px;
        }

        .estrella-espacio {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: parpadeoStar 2s infinite ease-in-out alternate;
        }

        @keyframes parpadeoStar {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .estrella-fugaz {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,1), rgba(255,255,255,0));
            transform: rotate(-45deg);
            animation: disparoFugaz 3s linear infinite;
            opacity: 0;
        }

        @keyframes disparoFugaz {
            0% { transform: translateX(0) translateY(0) rotate(-45deg); opacity: 1; width: 80px; }
            100% { transform: translateX(-400px) translateY(400px) rotate(-45deg); opacity: 0; width: 10px; }
        }

        #grupo-interactivo {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
            z-index: 5;
            width: 100%;
            max-width: 300px;
            text-align: center;
        }

        #boton-inicio {
            width: 100%;
            max-width: 260px;
            padding: 15px 20px;
            font-size: 19px;
            background: linear-gradient(135deg, #FF1744, #D50000);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(255, 23, 68, 0.8);
            transition: all 0.3s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        #boton-inicio:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 23, 68, 1);
        }

        #texto-intentos {
            margin-top: 18px;
            color: #ff80ab;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 64, 129, 0.5);
            padding: 0 10px;
        }

        #espacio-animacion {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="pantalla-inicio">
        <div id="grupo-estrellas"></div>
        <div id="grupo-interactivo">
            <button id="boton-inicio">Presiona aquí ✨</button>
            <div id="texto-intentos">Toca para descubrir algo especial</div>
        </div>
    </div>

    <div id="espacio-animacion">
        <canvas id="canvasSorpresa"></canvas>
    </div>

    <script>
        const contenedorEstrellas = document.getElementById('grupo-estrellas');
        const esCelular = window.innerWidth < 768;
        const numEstrellas = esCelular ? 40 : 70;

        for (let i = 0; i < numEstrellas; i++) {
            let star = document.createElement('div');
            star.className = 'estrella-espacio';
            let size = Math.random() * 2.5 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.animationDelay = (Math.random() * 2) + 's';
            contenedorEstrellas.appendChild(star);
        }

        for (let j = 0; j < 2; j++) {
            let fugaz = document.createElement('div');
            fugaz.className = 'estrella-fugaz';
            fugaz.style.top = (Math.random() * 40) + 'vh';
            fugaz.style.left = (Math.random() * 40 + 60) + 'vw';
            fugaz.style.animationDelay = (j * 3 + Math.random()) + 's';
            contenedorEstrellas.appendChild(fugaz);
        }

        const grupoInteractivo = document.getElementById('grupo-interactivo');
        const botonInicio = document.getElementById('boton-inicio');
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const espacioAnimacion = document.getElementById('espacio-animacion');
        const textoIntentos = document.getElementById('texto-intentos');

        let intentos = 0;

        botonInicio.addEventListener('click', function() {
            intentos++;

            if (intentos === 1) {
                grupoInteractivo.style.transform = 'translate(60px, -50px)';
                textoIntentos.innerText = "¡Uy, casi! Intenta de nuevo 😜";
            } 
            else if (intentos === 2) {
                grupoInteractivo.style.transform = 'translate(-60px, 60px)';
                textoIntentos.innerText = "¡Otra vez fallaste! Jaja 😂";
            } 
            else if (intentos >= 3) {
                pantallaInicio.style.display = 'none';
                espacioAnimacion.style.display = 'block';
                iniciarSorpresaTotal();
            }
        });

        function iniciarSorpresaTotal() {
            const canvas = document.getElementById('canvasSorpresa');
            const ctx = canvas.getContext('2d');

            function ajustarCanvas() {
                const dpr = window.devicePixelRatio || 1;
                canvas.width = window.innerWidth * dpr;
                canvas.height = window.innerHeight * dpr;
                ctx.scale(dpr, dpr);
            }
            ajustarCanvas();
            window.addEventListener('resize', ajustarCanvas);

            const estrellasFondoCanvas = [];
            const cantidadEstrellasCanvas = esCelular ? 45 : 85;
            for (let i = 0; i < cantidadEstrellasCanvas; i++) {
                estrellasFondoCanvas.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    tamano: Math.random() * 1.5 + 0.5,
                    alfa: Math.random() * 0.7 + 0.2
                });
            }

            const secuencia = [
                "Te amo",
                "Mi niña",
                "Preciosa",
                "Gracias por existir",
                "CORAZON"
            ];

            let indicePaso = 0;
            let particulasTexto = [];
            let contadorFrames = 0;
            const duracionPaso = 180; 

            class CorazonLluvia {
                constructor() {
                    this.reiniciar();
                }

                reiniciar() {
                    this.x = Math.random() * window.innerWidth;
                    this.y = -30 - Math.random() * 150;
                    this.vy = Math.random() * 3.5 + 2.5; 
                    this.vx = (Math.random() - 0.5) * 1.5;
                    this.tamano = Math.random() * 6 + 4;
                    const colores = ['#FF0000', '#FF1744', '#FF4081', '#FFD700', '#FFFFFF', '#00E676'];
                    this.color = colores[Math.floor(Math.random() * colores.length)];
                    this.rotacion = Math.random() * Math.PI;
                    this.vRot = (Math.random() - 0.5) * 0.1;
                }

                actualizar(esCorazonActivo) {
                    this.y += this.vy;
                    this.x += this.vx;
                    this.rotacion += this.vRot;

                    let centroX = window.innerWidth / 2;
                    let centroY = window.innerHeight / 2;
                    let colisiona = false;
                    let limiteTextoAncho = esCelular ? 160 : 240;

                    if (esCorazonActivo) {
                        let dx = this.x - centroX;
                        let dy = this.y - centroY;
                        let distancia = Math.sqrt(dx * dx + dy * dy);
                        if (distancia < (esCelular ? 120 : 160)) {
                            colisiona = true;
                        }
                    } else {
                        if (this.y > centroY - 45 && this.y < centroY + 45 &&
                            this.x > centroX - limiteTextoAncho && this.x < centroX + limiteTextoAncho) {
                            colisiona = true;
                        }
                    }

                    if (colisiona) {
                        if (this.x < centroX) {
                            this.vx = -4;
                            this.x -= 5;
                        } else {
                            this.vx = 4;
                            this.x += 5;
                        }
                        this.y -= 2;
                    }

                    if (this.y > window.innerHeight + 30 || this.x < -50 || this.x > window.innerWidth + 50) {
                        this.reiniciar();
                    }
                }

                dibujar() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotacion);
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = this.color;

                    ctx.beginPath();
                    let t = this.tamano;
                    ctx.moveTo(0, t / 4);
                    ctx.bezierCurveTo(-t, -t / 2, -t, t, 0, t * 1.2);
                    ctx.bezierCurveTo(t, t, t, -t / 2, 0, t / 4);
                    ctx.fill();
                    ctx.restore();
                }
            }

            class ParticulaTexto {
                constructor() {
                    this.x = Math.random() * window.innerWidth;
                    this.y = Math.random() * window.innerHeight;
                    this.destinoX = this.x;
                    this.destinoY = this.y;
                    const tonalidadesRojasPuras = ['#FF0000', '#FF1111', '#E60000', '#FF2222', '#CC0000'];
                    this.color = tonalidadesRojasPuras[Math.floor(Math.random() * tonalidadesRojasPuras.length)];
                    this.tamano = Math.random() * 1.8 + 1.1;
                    this.velocidad = 0.14; 
                }

                actualizar() {
                    let dx = this.destinoX - this.x;
                    let dy = this.destinoY - this.y;
                    this.x += dx * this.velocidad;
                    this.y += dy * this.velocidad;
                }

                dibujar() {
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#FF0000';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.tamano, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function obtenerPuntosTexto(texto) {
                const offScreenCanvas = document.createElement('canvas');
                const offCtx = offScreenCanvas.getContext('2d');
                const w = window.innerWidth;
                const h = window.innerHeight;
                offScreenCanvas.width = w;
                offScreenCanvas.height = h;

                offCtx.fillStyle = '#ffffff';
                
                let fontSize;
                if (esCelular) {
                    if (texto.length > 15) {
                        fontSize = Math.min(w / 7.2, 35);
                    } else if (texto.length > 8) {
                        fontSize = Math.min(w / 5.5, 45);
                    } else {
                        fontSize = Math.min(w / 4.6, 58);
                    }
                } else {
                    fontSize = Math.min(w / 5.2, 80);
                }

                offCtx.font = `bold ${fontSize}px sans-serif`;
                offCtx.textAlign = 'center';
                offCtx.textBaseline = 'middle';
                offCtx.fillText(texto, w / 2, h / 2);

                const imgData = offCtx.getImageData(0, 0, w, h);
                const puntos = [];
                // SALTO ÓPTIMO: Letras claras, nítidas y súper legibles sin verse sobrecargadas
                const salto = esCelular ? 4 : 5;

                for (let y = 0; y < h; y += salto) {
                    for (let x = 0; x < w; x += salto) {
                        const index = (y * w + x) * 4;
                        if (imgData.data[index + 3] > 128) {
                            puntos.push({ x: x, y: y });
                        }
                    }
                }
                return puntos;
            }

            function obtenerPuntosCorazon() {
                const puntos = [];
                const cx = window.innerWidth / 2;
                const cy = window.innerHeight / 2;
                
                let factorEscala = Math.min(window.innerWidth, window.innerHeight) / (esCelular ? 900 : 750);

                [60, 110, 160, 210].forEach(escala => {
                    let escalaReal = escala * factorEscala;
                    for (let t = 0; t < Math.PI * 2; t += 0.08) {
                        let hx = 16 * Math.pow(Math.sin(t), 3);
                        let hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                        puntos.push({
                            x: cx + hx * (escalaReal / 15),
                            y: cy + hy * (escalaReal / 15)
                        });
                    }
                });
                return puntos;
            }

            const totalParticulas = esCelular ? 1000 : 1400;
            for (let i = 0; i < totalParticulas; i++) {
                particulasTexto.push(new ParticulaTexto());
            }

            // MÁS CORAZONES: Lluvia abundante y muy romántica
            const totalCorazonesLluvia = esCelular ? 65 : 110;
            let lluvia = [];
            for (let i = 0; i < totalCorazonesLluvia; i++) {
                lluvia.push(new CorazonLluvia());
            }

            function actualizarDestinos() {
                let actual = secuencia[indicePaso];
                let puntosObjetivo = (actual === "CORAZON") ? obtenerPuntosCorazon() : obtenerPuntosTexto(actual);

                for (let i = 0; i < particulasTexto.length; i++) {
                    if (puntosObjetivo.length > 0) {
                        let pt = puntosObjetivo[i % puntosObjetivo.length];
                        particulasTexto[i].destinoX = pt.x + (Math.random() - 0.5) * 3;
                        particulasTexto[i].destinoY = pt.y + (Math.random() - 0.5) * 3;
                    }
                }
            }

            actualizarDestinos();

            function animar() {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

                for (let est of estrellasFondoCanvas) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${est.alfa})`;
                    ctx.fillRect(est.x, est.y, est.tamano, est.tamano);
                }

                contadorFrames++;
                if (contadorFrames > duracionPaso) {
                    contadorFrames = 0;
                    indicePaso = (indicePaso + 1) % secuencia.length;
                    actualizarDestinos();
                }

                let esCorazonActivo = (secuencia[indicePaso] === "CORAZON");

                for (let c of lluvia) {
                    c.actualizar(esCorazonActivo);
                    c.dibujar();
                }

                for (let p of particulasTexto) {
                    p.actualizar();
                    p.dibujar();
                }

                requestAnimationFrame(animar);
            }

            animar();
        }
    </script>

</body>
</html>
